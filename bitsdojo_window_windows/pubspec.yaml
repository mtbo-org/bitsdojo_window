name: bitsdojo_window_windows
description: Windows implementation of the bitsdojo_window plugin.
version: 0.2.0
homepage: https://www.bitsdojo.com
repository: https://github.com/bitsdojo/bitsdojo_window
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.2"

dependencies:
  flutter:
    sdk: flutter
  bitsdojo_window_platform_interface:
    git:
      url: https://github.com/mtbo-org/bitsdojo_window.git
      tag_pattern: v{{version}}
      path: bitsdojo_window_platform_interface
    version: ^0.2.0
  win32: ^5.15.0
  ffi: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: BitsdojoWindowPlugin
